name: Export playable builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -L --fail -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Test and export
        run: |
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/run_tests.gd -- --test
          mkdir -p builds/windows builds/linux builds/web
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop"
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Linux"
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Web"
          for target in windows linux web; do
            cp -r licenses "builds/$target/"
            cp assets/fonts/OFL.txt "builds/$target/licenses/FONT_OFL.txt"
            cp THIRD_PARTY_LICENSES.md "builds/$target/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FuyunLife-0.2.0-Windows
          path: builds/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: FuyunLife-0.2.0-Linux
          path: builds/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: FuyunLife-0.2.0-Web
          path: builds/web/
