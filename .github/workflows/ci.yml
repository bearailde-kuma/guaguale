name: Godot checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import and check gameplay
        run: |
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/run_tests.gd -- --test
      - name: Simulate progression
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/simulate.gd -- --test
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: docs/balance-report.json
